[project]
name = "musee"
version = "0.1.0"
description = "Musee - AI-powered artwork analysis API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.1",
    "uvicorn[standard]>=0.38.0",
    "python-multipart>=0.0.20",
    "pillow>=12.0.0",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17.0",
    "python-dotenv>=1.1.1",
    "openai>=2.6.0",
    "anthropic>=0.71.0",
    "google-generativeai>=0.8.5",
    "aiofiles>=25.1.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "python-jose>=3.5.0",
    "passlib>=1.7.4",
    "aiohttp>=3.13.2",
    "psycopg2-binary>=2.9.11",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
